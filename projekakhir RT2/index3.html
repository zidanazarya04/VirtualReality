<html>
  <head>
    <meta charset="utf-8" />
    <title>Virtual Tour - Candi Kidal (Scene 1)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,shrink-to-fit=no,user-scalable=no,minimal-ui">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="black">
    <link rel="icon" sizes="965x354" href="https://virtual.ub.ac.id/wp-content/uploads/2020/09/logovirtual2.png">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <!-- <script src="js/aframe-master.js"></script> -->
    <script src="js/aframe-href-component.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>

  <body data-gr-c-s-loaded="true">

    <a-scene canvas="" keyboard-shortcuts="" vr-mode-ui="">
      <a-entity position="0 1.8 4">
        <a-camera id="camera" look-controls="" wasd-controls-enabled="false" camera="active:true" rotation="-1.3750987083139854 -3.0939720937064483 0" position="0 0 0">
          <!-- <a-cursor color="#4CC3D9"></a-cursor> -->
          <a-ring radius-outer="0.30" radius-inner="0.20" position="0 0 -3" material="color: cyan; shader: flat" cursor="maxDistance: 30; fuse: true" geometry="primitive:ring;radiusOuter:0.30;radiusInner:0.20" raycaster="" scale="0.4628376812078244 0.4628376812078244 0.4628376812078244">
            <a-animation begin="click" easing="ease-in" attribute="scale" fill="backwards" from="0.1 0.1 0.1" to="1 1 1" dur="150"></a-animation>
            <a-animation begin="fusing" easing="ease-in" attribute="scale" fill="forwards" from="1 1 1" to="0.1 0.1 0.1" dur="1500"></a-animation>
          </a-ring>
        </a-camera>
      </a-entity>


      <!-- SKY 1 -->
      <a-sky src="img/papan informasi.jpg" rotation="0 -90 0"></a-sky>


      <!-- BUTTON → NEXT (ke Scene 2) -->
      <a-entity position="0 1.8 -2">

        <!-- kotak -->
        <a-plane class="clickable"
                 position="0 1.8 -2"
                 width="3"
                 height="0.7"
                 color="#222"
                 opacity="0"
                 shader="flat"
                 href="index2.html">
        </a-plane>

        <a-plane class="clickable"
                 position="0 -1.8 -2"
                 width="3"
                 height="0.7"
                 color="#222"
                 opacity="0"
                 shader="flat"
                 href="index4.html">
        </a-plane>

        <!-- teks -->
>
        <a-text value="➡️ Pergi ke Area Tengah Candi"
                align="center"
                width="10"
                color="#FFD700"
                position="0 -1.8 -2">
        </a-text>

        <a-text value="➡️ Kembali ke Pos Satpam"
                align="center"
                width="10"
                color="#FFD700"
                position="0 1.8 -2">
        </a-text>

      </a-entity>
          
            <!-- ICON INFO -->
      <a-entity id="infoButton" class="clickable"
                geometry="primitive: plane; width: 0.4; height: 0.4"
                material="src: img/info.png; transparent: true"
                position="1.5 2 -2"
                onclick="toggleInfo()">
      </a-entity>
      
      <!-- BOX + TEKS YANG MUNCUL -->
      <a-entity id="infoBox" visible="false">
        <a-plane width="3" height="1.5" color="#000" opacity="0.7" position="0 0 -2"></a-plane>
        <a-text value="Ini adalah informasi tambahan tentang scene ini."
                width="2.8"
                align="center"
                position="0 0 -1.99"
                color="#FFD700"></a-text>
      </a-entity>

      <script>
        function toggleInfo() {
          const box = document.getElementById("infoBox");
          box.setAttribute("visible", !box.getAttribute("visible"));
        }
      </script>

    </a-scene>
  </body>
</html>
